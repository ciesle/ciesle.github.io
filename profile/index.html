<!DOCTYPE html>
<html lang="ja">

<head>
	<title>プロフィール - 薊畑</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
  	<link rel="icon" href="/common/icon.ico">
	<link href="src/style.css" rel="stylesheet">
	<meta name="twitter:card" content="summary">
	<meta name="twitter:title" content="薊畑 -プロフィール-">
	<meta name="twitter:description" content="/bin/bash">
	<meta name="twitter:image" content="/common/icon.png">
</head>

<body>

	<header>
		<div class="blog-title">
			<h1>
				<img src="../common/icon.png" alt="" class="tab-icon">
				<a href="../">薊畑</a>
				<span class="tab-close">×</span>
			</h1>
			<h1>
				プロフィール
				<span class="tab-close">×</span>
			</h1>
		</div>
	</header>


	<main class="profile-main">
		<div class="terminal" id="terminal" aria-label="ターミナル">
			<div class="term-screen" id="term-screen" aria-live="polite">
				<form class="input-line" id="input-line" autocomplete="off">
					<span class="prompt-user" id="prompt">guest@ciesle-field</span><span class="prompt-colon">:</span><span class="prompt-path">~</span><span class="prompt-dollar">$</span>&nbsp;<span class="command-field"><input class="cmd" id="cmd" type="text" aria-label="コマンド" enterkeyhint="send" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"><span id="cursor-measure" class="cursor-measure" aria-hidden="true"></span><span id="terminal-cursor" class="terminal-cursor" aria-hidden="true"></span></span>
				</form>
			</div>
			<button id="stop-command" class="stop-command" type="button" hidden>中断（Ctrl+C）</button>
		</div>
	</main>

	<script src="src/terminal.js" defer></script>
</body>

</html>
