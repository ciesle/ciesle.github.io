<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 210" role="img" aria-labelledby="title desc">
<title id="title">calcの命令実行後のスタック</title>
<desc id="desc">a、bとa、a+b、2とa+b、(a+b)×2の順にスタックが変化する。上が先頭。</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#8b96a9"/></marker></defs>
<g font-family="sans-serif" text-anchor="middle">
<text x="250" y="24" fill="#667085" font-size="14">命令実行後のスタック（上が先頭）</text>
<text x="50" y="55" font-size="12" fill="#667085">1</text>
<rect x="6" y="118" width="88" height="36" rx="4" fill="#edf2ff" stroke="#4444aa" stroke-width="2"/>
<text x="50" y="141" font-size="16" fill="#25324a">a</text>
<text x="50" y="184" font-family="monospace" font-size="11" fill="#25324a">local.get $a</text>
<path d="M97 136 H103" stroke="#8b96a9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="150" y="55" font-size="12" fill="#667085">2</text>
<rect x="106" y="118" width="88" height="36" rx="4" fill="#edf2ff" stroke="#4444aa" stroke-width="2"/>
<text x="150" y="141" font-size="16" fill="#25324a">a</text>
<rect x="106" y="78" width="88" height="36" rx="4" fill="#edf2ff" stroke="#4444aa" stroke-width="2"/>
<text x="150" y="101" font-size="16" fill="#25324a">b</text>
<text x="150" y="184" font-family="monospace" font-size="11" fill="#25324a">local.get $b</text>
<path d="M197 136 H203" stroke="#8b96a9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="250" y="55" font-size="12" fill="#667085">3</text>
<rect x="206" y="118" width="88" height="36" rx="4" fill="#edf2ff" stroke="#4444aa" stroke-width="2"/>
<text x="250" y="141" font-size="16" fill="#25324a">a+b</text>
<text x="250" y="184" font-family="monospace" font-size="11" fill="#25324a">i32.add</text>
<path d="M297 136 H303" stroke="#8b96a9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350" y="55" font-size="12" fill="#667085">4</text>
<rect x="306" y="118" width="88" height="36" rx="4" fill="#edf2ff" stroke="#4444aa" stroke-width="2"/>
<text x="350" y="141" font-size="16" fill="#25324a">a+b</text>
<rect x="306" y="78" width="88" height="36" rx="4" fill="#edf2ff" stroke="#4444aa" stroke-width="2"/>
<text x="350" y="101" font-size="16" fill="#25324a">2</text>
<text x="350" y="184" font-family="monospace" font-size="11" fill="#25324a">i32.const 2</text>
<path d="M397 136 H403" stroke="#8b96a9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="450" y="55" font-size="12" fill="#667085">5</text>
<rect x="406" y="118" width="88" height="36" rx="4" fill="#edf2ff" stroke="#4444aa" stroke-width="2"/>
<text x="450" y="141" font-size="16" fill="#25324a">(a+b)×2</text>
<text x="450" y="184" font-family="monospace" font-size="11" fill="#25324a">i32.mul</text>
</g></svg>
