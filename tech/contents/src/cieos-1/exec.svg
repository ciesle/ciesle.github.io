<rect x="277.3" y="141" width="75" height="24" fill="white"/>
<text x="314.8" y="158" fill="#111d38" text-anchor="middle">uservec</text>
<rect x="568.0" y="141" width="75" height="24" fill="white"/>
<text x="605.5" y="158" fill="#111d38" text-anchor="middle">userret</text>
<rect x="626.8" y="5" width="30" height="24" fill="white"/>
