<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="551" viewBox="0 0 1140 551" role="img" aria-labelledby="title desc">
<title id="title">execによるプログラムの切り替え</title>
<desc id="desc">関数ごとの横ライフライン上に実行区間を示し、縦矢印で呼び出しと復帰をつなぐ。右側に各関数の処理を示す。薄い帯は中断中の実行を表す。</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#111d38"/></marker></defs>
<rect width="1140" height="551" fill="white"/>
<g font-family="Noto Sans JP, sans-serif" font-size="16" font-weight="400">
<rect x="216" y="8" width="134" height="204" rx="6" fill="#e9eff3" stroke="#becfdc"/>
<text x="362" y="78" fill="#111d38" text-anchor="start">initの</text>
<text x="362" y="102" fill="#111d38" text-anchor="start">ページテーブル</text>
<rect x="566" y="8" width="124" height="204" rx="6" fill="#e9eff3" stroke="#becfdc"/>
<text x="554" y="138" fill="#111d38" text-anchor="end">shの</text>
<text x="554" y="162" fill="#111d38" text-anchor="end">ページテーブル</text>
<rect x="16" y="23" width="192" height="34" rx="4" fill="#111d38"/>
<text x="112" y="46" fill="white" text-anchor="middle">ユーザ空間</text>
<path d="M224 40 H660" fill="none" stroke="#8992a3" stroke-width="1.25" stroke-dasharray="5 5"/>
<text x="700" y="46" fill="#25324a" text-anchor="start">init：exec(&quot;/bin/sh&quot;, &amp;argv)を呼び出す</text>
<text x="700" y="70" fill="#25324a" text-anchor="start">復帰後は/bin/shの開始位置から実行</text>
<rect x="16" y="99" width="192" height="34" rx="4" fill="#111d38"/>
<text x="112" y="122" fill="white" text-anchor="middle">usys::sys_exec</text>
<path d="M224 116 H660" fill="none" stroke="#8992a3" stroke-width="1.25" stroke-dasharray="5 5"/>
<text x="700" y="122" fill="#25324a" text-anchor="start">a7に7をロードし、ecall</text>
<rect x="16" y="159" width="192" height="34" rx="4" fill="#111d38"/>
<text x="112" y="182" fill="white" text-anchor="middle">trampoline</text>
<path d="M224 176 H660" fill="none" stroke="#8992a3" stroke-width="1.25" stroke-dasharray="5 5"/>
<text x="700" y="182" fill="#25324a" text-anchor="start">usertrapへ遷移</text>
<text x="700" y="206" fill="#25324a" text-anchor="start">復帰時は新しいページテーブルでユーザ空間へ戻る</text>
<rect x="16" y="256" width="192" height="34" rx="4" fill="#111d38"/>
<text x="112" y="279" fill="white" text-anchor="middle">usertrap</text>
<path d="M224 273 H660" fill="none" stroke="#8992a3" stroke-width="1.25" stroke-dasharray="5 5"/>
<text x="700" y="279" fill="#25324a" text-anchor="start">scauseが8なのでsyscallへ</text>
<text x="700" y="303" fill="#25324a" text-anchor="start">復帰後にsepc、trapvecを設定してuserretへ</text>
<rect x="16" y="332" width="192" height="34" rx="4" fill="#111d38"/>
<text x="112" y="355" fill="white" text-anchor="middle">syscall</text>
<path d="M224 349 H660" fill="none" stroke="#8992a3" stroke-width="1.25" stroke-dasharray="5 5"/>
<text x="700" y="355" fill="#25324a" text-anchor="start">sys_execを呼び、戻り値を受け取る</text>
<rect x="16" y="390" width="192" height="34" rx="4" fill="#111d38"/>
<text x="112" y="413" fill="white" text-anchor="middle">sys_exec</text>
<path d="M224 407 H660" fill="none" stroke="#8992a3" stroke-width="1.25" stroke-dasharray="5 5"/>
<text x="700" y="413" fill="#25324a" text-anchor="start">引数を整え、kexecへ渡す</text>
<rect x="16" y="448" width="192" height="34" rx="4" fill="#111d38"/>
<text x="112" y="471" fill="white" text-anchor="middle">kexec</text>
<path d="M224 465 H660" fill="none" stroke="#8992a3" stroke-width="1.25" stroke-dasharray="5 5"/>
<text x="700" y="471" fill="#25324a" text-anchor="start">FSからelfを読み、新しいページテーブルを作成</text>
<text x="700" y="495" fill="#25324a" text-anchor="start">コードをメモリ上にロードし、trapframeにepcとspを設定</text>
<text x="700" y="519" fill="#25324a" text-anchor="start">ページテーブルを入れ替え、第1引数を&amp;argvとして返す</text>
