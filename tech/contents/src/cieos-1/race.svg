<svg xmlns="http://www.w3.org/2000/svg" width="800" height="452" viewBox="0 0 800 452" role="img" aria-labelledby="title desc">
<title id="title">条件の確認とsleepの間に起こる通知の取り逃がし</title>
<desc id="desc">左に親の手順1、2、3を示す。状態確認は一つの長方形の左から約4分の1の位置の縦矢印で示し、1・p・nの3点を置き、ラベルを右側に添える。nは矢印の先端に置く。pの確認済み位置より後に、右の子pが終了して通知する矢印が入る。親は起きているので通知を無視し、走査が終わるとsleepに入る。</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#111d38"/></marker></defs>
<rect width="800" height="452" fill="white"/>
<g font-family="Noto Sans JP, sans-serif">
<rect x="16" y="12" width="388" height="36" rx="4" fill="#111d38" stroke="#111d38" stroke-width="1.5"/>
<text x="210" y="36" fill="white" font-size="16" font-weight="700" text-anchor="middle">親プロセス</text>
<rect x="444" y="12" width="340" height="36" rx="4" fill="#111d38" stroke="#111d38" stroke-width="1.5"/>
<text x="614" y="36" fill="white" font-size="16" font-weight="700" text-anchor="middle">子プロセス p</text>
<rect x="16" y="64" width="388" height="40" rx="4" fill="white" stroke="#111d38" stroke-width="1.5"/>
<text x="30" y="90" fill="#25324a" font-size="16" font-weight="400" text-anchor="start">1. 親がwakeupされる</text>
<path d="M204 113 H216 L210 123 Z" fill="#111d38"/>
<rect x="16" y="132" width="388" height="204" rx="4" fill="white" stroke="#111d38" stroke-width="1.5"/>
<text x="30" y="158" fill="#25324a" font-size="16" font-weight="700" text-anchor="start">2. 子の状態を順番に確認</text>
<path d="M113 174 V304" fill="none" stroke="#111d38" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="113" cy="182" r="4" fill="#111d38"/>
<text x="127" y="188" fill="#25324a" font-size="16" font-weight="400" text-anchor="start">1</text>
<circle cx="113" cy="220" r="4" fill="#111d38"/>
<text x="127" y="226" fill="#25324a" font-size="16" font-weight="400" text-anchor="start">p</text>
<circle cx="113" cy="304" r="4" fill="#111d38"/>
<text x="127" y="310" fill="#25324a" font-size="16" font-weight="400" text-anchor="start">n</text>
<rect x="444" y="236" width="340" height="40" rx="4" fill="#111d38" stroke="#111d38" stroke-width="1.5"/>
<text x="458" y="262" fill="white" font-size="16" font-weight="400" text-anchor="start">子 p が終了し、親をwakeup</text>
<path d="M442 256 H119" fill="none" stroke="#111d38" stroke-width="2" marker-end="url(#arrow)"/>
<text x="322" y="244" fill="#111d38" font-size="16" font-weight="400" text-anchor="middle">通知</text>
<text x="156" y="281" fill="#111d38" font-size="16" font-weight="400" text-anchor="start">親は起きているため、</text>
<text x="156" y="303" fill="#111d38" font-size="16" font-weight="400" text-anchor="start">通知を無視</text>
<path d="M204 347 H216 L210 357 Z" fill="#111d38"/>
<rect x="16" y="368" width="388" height="40" rx="4" fill="white" stroke="#111d38" stroke-width="1.5"/>
<text x="30" y="394" fill="#25324a" font-size="16" font-weight="400" text-anchor="start">3. 終了した子はいないと判断しsleep</text>
<text x="400" y="437" fill="#111d38" font-size="16" font-weight="700" text-anchor="middle">通知を取り逃がしたままsleepに入る</text>
</g>
</svg>
