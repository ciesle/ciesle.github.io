<rect x="592.9" y="104" width="33.6" height="12" fill="#111d38"/>
<path d="M626.5 103 V47" fill="none" stroke="#111d38" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="626.5" y="34" width="33.5" height="12" fill="#111d38"/>
<rect x="236.8" y="75" width="75" height="24" fill="white"/>
<text x="274.3" y="92" fill="#111d38" text-anchor="middle">uservec</text>
<rect x="572.2" y="75" width="75" height="24" fill="white"/>
<text x="609.7" y="92" fill="#111d38" text-anchor="middle">userret</text>
<rect x="224.0" y="446.8" width="201.2" height="12" fill="#111d38" opacity=".25"/>
<rect x="458.8" y="446.8" width="201.2" height="12" fill="#111d38" opacity=".25"/>
