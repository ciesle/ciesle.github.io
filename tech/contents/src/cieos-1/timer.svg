<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="514.8" viewBox="0 0 1140 514.8" role="img" aria-labelledby="title desc">
<title id="title">タイマー割り込みとユーザ空間への復帰</title>
<desc id="desc">関数ごとの横ライフライン上に実行区間を示し、縦矢印で呼び出しと復帰をつなぐ。右側に各関数の処理を示す。薄い帯は中断中の実行を表す。</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#111d38"/></marker></defs>
<rect width="1140" height="514.8" fill="white"/>
<g font-family="Noto Sans JP, sans-serif" font-size="16" font-weight="400">
<rect x="216.0" y="8" width="183.7" height="341.2" rx="6" fill="#e9eff3" stroke="#becfdc"/>
<text x="307.85" y="26" fill="#111d38" text-anchor="middle">プロセス1</text>
<rect x="484.3" y="8" width="183.7" height="341.2" rx="6" fill="#e9eff3" stroke="#becfdc"/>
<text x="576.15" y="26" fill="#111d38" text-anchor="middle">プロセス2</text>
<path d="M16 394.8 H1124" stroke="#111d38" stroke-width="1" opacity=".5"/>
<rect x="16" y="23" width="192" height="34" rx="4" fill="#111d38"/>
<text x="112" y="46" fill="white" text-anchor="middle">ユーザ空間</text>
<path d="M224 40 H660" fill="none" stroke="#8992a3" stroke-width="1.25" stroke-dasharray="5 5"/>
<text x="700" y="46" fill="#25324a" text-anchor="start">タイマー割り込みでtrampolineへ</text>
<text x="700" y="70" fill="#25324a" text-anchor="start">復帰後は元のプログラムカウンタから実行を再開</text>
<rect x="16" y="93" width="192" height="34" rx="4" fill="#111d38"/>
<text x="112" y="116" fill="white" text-anchor="middle">trampoline</text>
<path d="M224 110 H660" fill="none" stroke="#8992a3" stroke-width="1.25" stroke-dasharray="5 5"/>
<text x="700" y="116" fill="#25324a" text-anchor="start">レジスタを保存し、カーネル用ページテーブルへ</text>
<text x="700" y="140" fill="#25324a" text-anchor="start">復帰時はtrapframeから設定したsepcへsretで戻る</text>
<rect x="16" y="182" width="192" height="34" rx="4" fill="#111d38"/>
<text x="112" y="205" fill="white" text-anchor="middle">usertrap</text>
<path d="M224 199 H660" fill="none" stroke="#8992a3" stroke-width="1.25" stroke-dasharray="5 5"/>
<text x="700" y="205" fill="#25324a" text-anchor="start">s_causeが8でなく、which_devが2なのでyield_cpuへ</text>
<text x="700" y="229" fill="#25324a" text-anchor="start">復帰後にsepc、trapvecを設定してuserretへ</text>
<rect x="16" y="258" width="192" height="34" rx="4" fill="#111d38"/>
<text x="112" y="281" fill="white" text-anchor="middle">yield_cpu</text>
<path d="M224 275 H660" fill="none" stroke="#8992a3" stroke-width="1.25" stroke-dasharray="5 5"/>
<text x="700" y="281" fill="#25324a" text-anchor="start">プロセス1をRUNNABLEに変更</text>
<rect x="16" y="312.2" width="192" height="34" rx="4" fill="#111d38"/>
<text x="112" y="335.2" fill="white" text-anchor="middle">sched</text>
<path d="M224 329.2 H660" fill="none" stroke="#8992a3" stroke-width="1.25" stroke-dasharray="5 5"/>
<text x="700" y="335.2" fill="#25324a" text-anchor="start">swtchを呼び、復帰後にusertrapへ戻る</text>
<rect x="16" y="377.8" width="192" height="34" rx="4" fill="#111d38"/>
<text x="112" y="400.8" fill="white" text-anchor="middle">swtch</text>
<path d="M224 394.8 H660" fill="none" stroke="#8992a3" stroke-width="1.25" stroke-dasharray="5 5"/>
<rect x="692" y="378.8" width="368.3" height="30" fill="white"/>
<text x="700" y="400.8" fill="#25324a" text-anchor="start">プロセスとschedulerのコンテキストを切り替える</text>
<rect x="16" y="435.8" width="192" height="34" rx="4" fill="#111d38"/>
<text x="112" y="458.8" fill="white" text-anchor="middle">scheduler</text>
<path d="M224 452.8 H660" fill="none" stroke="#8992a3" stroke-width="1.25" stroke-dasharray="5 5"/>
<text x="700" y="458.8" fill="#25324a" text-anchor="start">各CPUの領域に保存したコンテキストで再開</text>
<text x="700" y="482.8" fill="#25324a" text-anchor="start">次のプロセスを選び、swtchでschedへ戻る</text>
<rect x="224.0" y="34" width="33.5" height="12" fill="#111d38"/>
