<text x="16" y="1004" fill="#25324a" font-size="16" font-weight="400" text-anchor="start">0x0C_000_000</text>
<rect x="184" y="1010" width="596" height="34" fill="#8294ad"/>
<text x="198" y="1033.0" fill="#111d38" font-size="16" font-weight="400" text-anchor="start">CLINT用領域</text>
<path d="M174 1056 H780" fill="none" stroke="#111d38" stroke-width="1.5"/>
<text x="16" y="1062" fill="#25324a" font-size="16" font-weight="400" text-anchor="start">0x02_000_000</text>
<rect x="184" y="1068" width="596" height="34" fill="#becfdc"/>
<text x="198" y="1091.0" fill="#25324a" font-size="16" font-weight="400" text-anchor="start">boot ROM</text>
<path d="M174 1114 H780" fill="none" stroke="#111d38" stroke-width="1.5"/>
